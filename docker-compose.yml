services:
  mongodb:
    image: mongo:8.0
    container_name: document_insights_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:8
    container_name: document_insights_redis
    ports:
      - "6379:6379"
  api:
    build: .
    container_name: document_insights_api
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: 'mongodb://mongodb:27017'
      MONGODB_DATABASE: 'document_insights'
      REDIS_URL: 'redis://redis:6379'
      MAX_ACTIVE_JOBS_PER_USER: '3'
      ACTIVE_JOB_TTL_SECONDS: '900'
      SUMMARY_CACHE_TTL_SECONDS: '86400'
      PROCESSING_MIN_SECONDS: '10'
      PROCESSING_MAX_SECONDS: '30'
      PROCESSING_FAILURE_RATE: '0.10'
    depends_on:
      - mongodb
      - redis
  worker:
    build: .
    container_name: document_insights_worker
    command: python -m app.worker.main
    environment:
      MONGODB_URL: 'mongodb://mongodb:27017'
      MONGODB_DATABASE: 'document_insights'
      REDIS_URL: 'redis://redis:6379'
      MAX_ACTIVE_JOBS_PER_USER: '3'
      ACTIVE_JOB_TTL_SECONDS: '900'
      SUMMARY_CACHE_TTL_SECONDS: '86400'
      PROCESSING_MIN_SECONDS: '10'
      PROCESSING_MAX_SECONDS: '30'
      PROCESSING_FAILURE_RATE: '0.10'
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data: